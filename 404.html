<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nijatva has moved to nijatva.github.io</title>
<link rel="canonical" href="https://nijatva.github.io/">
<meta name="robots" content="noindex, follow">
<style>
  :root{--bg:#0b0b0d;--fg:#f4f4f5;--mut:#a1a1aa;--accent:#f59e0b;--line:#2a2a31}
  @media (prefers-color-scheme:light){:root{--bg:#fbfbfc;--fg:#18181b;--mut:#5f5f6a;--accent:#b45309;--line:#e4e4ea}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--fg);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
  main{max-width:34rem}
  .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
        background:linear-gradient(140deg,var(--accent),#7a4405);color:#fff;font-weight:800;font-size:20px}
  h1{font-size:24px;line-height:1.25;letter-spacing:-.4px;margin:20px 0 10px}
  p{color:var(--mut);margin:0 0 14px;word-break:break-word}
  a{color:var(--accent)}
  .go{display:inline-block;margin-top:8px;background:var(--accent);color:#1a1204;
      text-decoration:none;font-weight:700;border-radius:999px;padding:12px 22px}
  .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
        background:var(--line);border-radius:8px;padding:2px 7px;color:var(--fg)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">N</div>
  <h1>This page is not here any more</h1>
  <p>The old site was at this address, and this particular page does not exist on
     the new one. Everything lives at <span class="addr">nijatva.github.io</span>.</p>
  <p id="wanted"></p>
  <a class="go" id="go" href="https://nijatva.github.io/">Go to nijatva.github.io</a>
</main>
<script>
  // Keep the path: an old deep link such as /apps.html has a good chance of
  // existing on the new site under the same name, so send the visitor there
  // rather than to the front page.
  (function () {
    try {
      var path = location.pathname.replace(/^\/+/, '');
      var target = 'https://nijatva.github.io/' + path + (location.search || '') + (location.hash || '');
      if (path) {
        document.getElementById('wanted').innerHTML =
          'Looking for <span class="addr">' + path.replace(/[<>&"]/g, '') + '</span>?';
        document.getElementById('go').href = target;
        location.replace(target);
      } else {
        location.replace('https://nijatva.github.io/');
      }
    } catch (e) { }
  })();
</script>
</body>
</html>
