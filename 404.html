<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found - Vasudev Dangaya</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="https://nijatva.github.io/assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0c0e1c;--panel:#141733;--line:#2a2f55;--fg:#eceefb;--mut:#9aa1c4;--accent:#f0b566;--accent-ink:#20160a}
  @media (prefers-color-scheme:light){:root{--bg:#f7f7fb;--panel:#fff;--line:#e2e4ef;--fg:#14172b;--mut:#5b6180;--accent:#b45309;--accent-ink:#fff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;
       padding:24px;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
  main{max-width:34rem}
  .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
      background:linear-gradient(140deg,var(--accent),#8a4b0f);color:#1b1206;font-weight:800;font-size:17px}
  h1{font-size:26px;line-height:1.2;letter-spacing:-.6px;margin:18px 0 10px}
  p{color:var(--mut);margin:0 0 12px;word-break:break-word}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--fg)}
  .btn{display:inline-flex;border-radius:999px;padding:11px 20px;margin-top:12px;
       background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:14.5px}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="av" aria-hidden="true">VD</div>
  <h1>That page is not here</h1>
  <p>You asked for <code id="wanted">that address</code>, and this site does not have it.</p>
  <p>The Nijatva suite has its own site at <a href="https://nijatva.github.io/">nijatva.github.io</a>.</p>
  <a class="btn" href="/">Back to Vasudev Dangaya</a>
</main>
<script>
  try {
    var p = location.pathname.replace(/^\/+/, '');
    if (p) document.getElementById('wanted').textContent = '/' + p;
  } catch (e) { }
</script>
</body>
</html>
