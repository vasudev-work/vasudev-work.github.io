<!doctype html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nijatva</title>
<meta name="theme-color" content="#0c0e1c">
<link rel="icon" href="https://nijatva.github.io/assets/favicon.svg" type="image/svg+xml">

<!-- Reached when someone follows an old deep link. The path is carried across to
     the new host, because an old address such as /apps.html very likely still
     exists there under the same name. Redirect first, explain afterwards. -->
<script>
  (function () {
    var path = location.pathname.replace(/^\/+/, '');
    var to = 'https://nijatva.github.io/' + path + (location.search || '') + (location.hash || '');
    try { location.replace(to); } catch (e) { }
    // the label is filled in later: this runs in the head, before the body exists
    try {
      if (path) {
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('wanted');
          if (el) el.textContent = '/' + path;
        });
      }
    } catch (e) { }
  })();
</script>
<link rel="canonical" href="https://nijatva.github.io/">
<meta name="robots" content="noindex, follow">

<style>
  :root{
    --bg:#0c0e1c; --panel:#151832; --line:#272c4d; --fg:#eceefb; --mut:#9aa1c4;
    --accent:#f0b566; --accent-ink:#20160a; --radius:18px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f7fb; --panel:#fff; --line:#e3e4ef; --fg:#14172b; --mut:#5b6180;
          --accent:#c9761b; --accent-ink:#fff;}
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
  .wrap{max-width:34rem;margin:0 auto;padding:0 20px 56px}
  header{display:flex;align-items:center;gap:10px;padding:18px 0 34px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);
         font-weight:700;font-size:18px}
  .brand img{width:34px;height:34px;display:block}
  .eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);
           font-weight:700;margin:0 0 12px}
  h1{font-size:clamp(26px,5.5vw,34px);line-height:1.15;letter-spacing:-.7px;margin:0 0 14px}
  p{color:var(--mut);margin:0 0 14px}
  .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--fg)}
  .btn{display:inline-flex;align-items:center;border-radius:999px;padding:12px 22px;margin-top:10px;
       background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://nijatva.github.io/">
      <img src="https://nijatva.github.io/assets/logo.svg" alt="">
      <span>Nijatva</span>
    </a>
  </header>

  <p class="eyebrow">Old address</p>
  <h1>This page is not here any more</h1>
  <p>The site moved to <span class="addr">nijatva.github.io</span>. You are being taken to
     the same page there.</p>
  <p>Looking for <span class="addr" id="wanted">that page</span>?</p>
  <a class="btn" href="https://nijatva.github.io/">Open nijatva.github.io</a>
</div>
</body>
</html>
