<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#1b1f45;color:#f2f3fb;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:52px;height:52px;border-radius:14px}
  .brand b{font-size:30px;letter-spacing:-.03em}
  .brand small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#b6bad6;font-weight:600;margin-top:2px}
  .mid{display:flex;align-items:center;justify-content:space-between;gap:40px}
  h1{font-size:56px;line-height:1.05;letter-spacing:-.035em;margin:0 0 16px;max-width:16ch}
  h1 em{font-style:normal;color:#e8a33d}
  p{margin:0;font-size:20px;color:#b6bad6;max-width:34ch;line-height:1.45}
  .grid{display:grid;grid-template-columns:repeat(3,72px);gap:16px;flex:none}
  .grid img{width:72px;height:72px;border-radius:18px}
  .foot{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#e8a33d;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .foot span{border:1px solid rgba(232,163,61,.4);border-radius:999px;padding:6px 14px}
</style></head><body>
  <div class="brand">
    <img src="../assets/logo.svg" alt="">
    <div><b>Nijatva</b><small>by DEVIRA</small></div>
  </div>
  <div class="mid">
    <div>
      <h1>24 apps. <em>No Google Play Services.</em></h1>
      <p>Small, single-purpose Android apps. No accounts, no ads, no analytics.</p>
    </div>
    <div class="grid">
      <img src="../assets/icons/notes.svg" alt="">
      <img src="../assets/icons/gallery.svg" alt="">
      <img src="../assets/icons/browser.svg" alt="">
      <img src="../assets/icons/camera.svg" alt="">
      <img src="../assets/icons/calendar.svg" alt="">
      <img src="../assets/icons/keyboard.svg" alt="">
    </div>
  </div>
  <div class="foot"><span>No accounts</span><span>No ads</span><span>No analytics</span><span>Made in India</span></div>
</body></html>
